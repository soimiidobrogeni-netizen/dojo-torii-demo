name: Browser smoke test - DOJO TORII
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Visit published demo and detect first frame
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const errs=[];
            page.on('console',m=>{if(m.type()==='error') errs.push('console: '+m.text())});
            page.on('pageerror',e=>errs.push('pageerror: '+e.message));
            page.on('requestfailed',r=>errs.push('request: '+r.url()+' '+r.failure()?.errorText));
            await page.goto('https://soimiidobrogeni-netizen.github.io/dojo-torii-demo/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(18000);
            await page.screenshot({path:'dojo-browser.png',fullPage:true});
            const state=await page.evaluate(()=>({title:document.title,body:document.body.innerText.slice(0,800),flutter:!!document.querySelector('flutter-view,flt-glass-pane'),overlay:!!document.getElementById('diag')}));
            console.log('BROWSER STATE:',JSON.stringify(state));
            console.log('BROWSER ERRORS:',JSON.stringify(errs));
            await browser.close();
            if(state.overlay||!state.flutter)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dojo-browser-screenshot
          path: dojo-browser.png
